services:
  codex-config:
    volumes:
      - ./packages/sdlc-mcp:/sdlc-mcp:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /data/codex-home /data/codex-home-docker
        cp /src/config.toml /data/codex-home/config.toml
        sed 's#localhost:4000#litellm:4000#' /src/config.toml > /data/codex-home-docker/config.toml
        printf '\n' >> /data/codex-home/config.toml
        cat /sdlc-mcp/codex.config.toml >> /data/codex-home/config.toml
        printf '\n' >> /data/codex-home-docker/config.toml
        cat /sdlc-mcp/codex.config.docker.toml >> /data/codex-home-docker/config.toml

  gateway:
    environment:
      FORGEJO_MCP_BEARER_TOKEN: ${FORGEJO_MCP_BEARER_TOKEN:-}
      WIKIJS_SDLC_MCP_BEARER_TOKEN: ${WIKIJS_SDLC_MCP_BEARER_TOKEN:-}
      FORGEJO_ACCESS_TOKEN: ${FORGEJO_ACCESS_TOKEN:?Set FORGEJO_ACCESS_TOKEN to a bot-scoped Forgejo token}
      WIKIJS_ACCESS_TOKEN: ${WIKIJS_ACCESS_TOKEN:?Set WIKIJS_ACCESS_TOKEN to a bot-scoped Wiki.js token}

  forgejo-mcp:
    image: ${FORGEJO_MCP_IMAGE:-ghcr.io/vrsarin/forgejo-mcp-server:main}
    profiles: [sdlc-mcp]
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: forgejo-mcp,localhost,127.0.0.1
      ENABLE_OIDC: ${ENABLE_OIDC:-false}
      ENABLE_TLS: ${ENABLE_TLS:-false}
      TLS_MODE: ${TLS_MODE:-}
      TLS_DOMAIN: ${FORGEJO_MCP_TLS_DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
      TLS_CERT_PATH: ${FORGEJO_MCP_TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${FORGEJO_MCP_TLS_KEY_PATH:-}
      MCP_CLIENT_TOKENS: ${FORGEJO_MCP_CLIENT_TOKENS:-}
      FORGEJO_URL: ${FORGEJO_URL:?Set FORGEJO_URL to the Forgejo origin reachable from this container}
      FORGEJO_ALLOW_INSECURE_HTTP: ${FORGEJO_ALLOW_INSECURE_HTTP:-false}
      SDLC_ALLOWED_REPOSITORIES: ${SDLC_ALLOWED_REPOSITORIES:?Set SDLC_ALLOWED_REPOSITORIES to owner/repository entries}
      SDLC_ENABLE_WRITES: ${SDLC_ENABLE_WRITES:-false}
    ports:
      - 127.0.0.1:${FORGEJO_MCP_PORT:-3010}:3000
    volumes:
      - ./.data/forgejo-mcp:/data
    healthcheck:
      test: [CMD, node, -e, "require(process.env.ENABLE_TLS==='true'?'https':'http').get((process.env.ENABLE_TLS==='true'?'https':'http')+'://127.0.0.1:3000/healthz',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  wikijs-sdlc-mcp:
    image: ${WIKIJS_SDLC_MCP_IMAGE:-ghcr.io/vrsarin/wikijs-sdlc-mcp-server:main}
    profiles: [sdlc-mcp]
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: wikijs-sdlc-mcp,localhost,127.0.0.1
      ENABLE_OIDC: ${ENABLE_OIDC:-false}
      ENABLE_TLS: ${ENABLE_TLS:-false}
      TLS_MODE: ${TLS_MODE:-}
      TLS_DOMAIN: ${WIKIJS_SDLC_MCP_TLS_DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
      TLS_CERT_PATH: ${WIKIJS_SDLC_MCP_TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${WIKIJS_SDLC_MCP_TLS_KEY_PATH:-}
      MCP_CLIENT_TOKENS: ${WIKIJS_SDLC_MCP_CLIENT_TOKENS:-}
      WIKIJS_MCP_URL: ${WIKIJS_MCP_URL:?Set WIKIJS_MCP_URL to the Wiki.js /_mcp endpoint reachable from this container}
      WIKIJS_ALLOW_INSECURE_MCP_HTTP: ${WIKIJS_ALLOW_INSECURE_MCP_HTTP:-false}
    ports:
      - 127.0.0.1:${WIKIJS_SDLC_MCP_PORT:-3011}:3000
    volumes:
      - ./.data/wikijs-sdlc-mcp:/data
    healthcheck:
      test: [CMD, node, -e, "require(process.env.ENABLE_TLS==='true'?'https':'http').get((process.env.ENABLE_TLS==='true'?'https':'http')+'://127.0.0.1:3000/healthz',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
