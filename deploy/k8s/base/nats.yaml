apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: [-m, "8222"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: {app: nats}
  ports:
    - {name: client, port: 4222}
