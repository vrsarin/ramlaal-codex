apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: homeassistant}
  template:
    metadata:
      labels: {app: homeassistant}
    spec:
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - {name: http, containerPort: 8123}
          env:
            - {name: TZ, value: America/New_York}
          readinessProbe:
            httpGet: {path: /manifest.json, port: http}
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /manifest.json, port: http}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
spec:
  selector: {app: homeassistant}
  ports:
    - {name: http, port: 8123}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
